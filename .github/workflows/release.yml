name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest

          - os: darwin
            arch: arm64
            runner: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build crabcore
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist

          go build \
            -ldflags "-X github.com/zerodotfive/crabcore/internal/version.CrabcoreVersion=${GITHUB_REF_NAME}" \
            -o "dist/crabcore-${{ matrix.os }}-${{ matrix.arch }}" \
            ./cmd/crabcore

      - name: Build ssh plugin
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build \
            -buildmode=plugin \
            -o "dist/ssh-${{ matrix.os }}-${{ matrix.arch }}.so" \
            ./plugins/ssh

      - name: Build kubernetes plugin
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build \
            -buildmode=plugin \
            -o "dist/kubernetes-${{ matrix.os }}-${{ matrix.arch }}.so" \
            ./plugins/kubernetes

      - name: Build tools plugin
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build \
            -buildmode=plugin \
            -o "dist/tools-${{ matrix.os }}-${{ matrix.arch }}.so" \
            ./plugins/tools

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          for file in dist/*; do
            shasum -a 256 "$file" | cut -d ' ' -f 1 > "${file}.sha256"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
