---
powerlineGoVersion: v1.26
powerlineGoShellRC:
  bash: |
    function _update_ps1() {
        PS1="$(powerline-go -modules "venv,user,host,time,ssh,cwd,perms,git,hg,jobs,kube,exit,root" -error $? -jobs $(jobs -p | wc -l))"
    }

    if [ "$TERM" != "linux" ] && [ -f ~/.local/bin/powerline-go ]; then
        PROMPT_COMMAND="_update_ps1; $PROMPT_COMMAND"
    fi
  zsh: |
    function powerline_precmd() {
      PS1="$(powerline-go -modules "venv,user,host,time,ssh,cwd,perms,git,hg,jobs,kube,exit,root" -error $? -jobs ${${(%):%j}:-0})"
    }
    
    function install_powerline_precmd() {
      for s in "${precmd_functions[@]}"; do
        if [ "$s" = "powerline_precmd" ]; then
          return
        fi
      done
      precmd_functions+=(powerline_precmd)
    }
    
    if [ "$TERM" != "linux" ] && [ -f ~/.local/bin/powerline-go ]; then
      install_powerline_precmd
    fi
